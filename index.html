<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>她和他们 · Her And Them</title>

    <meta
        name="theme-color"
        content="#eef4ff"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- 游戏根节点 -->
    <div id="game">

        <!-- 背景 -->
        <div id="background"></div>

        <!-- 页面容器 -->
        <main id="screen">

            <!-- Boot 页面 -->
            <section id="boot" class="page active">

                <div class="logo">

                    <h1>她和他们</h1>

                    <h2>Her And Them</h2>

                    <p class="author">
                        by 66
                    </p>

                    <button id="enterBtn">

                        点击进入

                    </button>

                </div>

            </section>

            <!-- 作者声明 -->
            <section id="statement" class="page">

                <div class="card">

                    <h2>作者声明</h2>

                    <p>
                        欢迎来到《她和他们》。
                    </p>

                    <p>
                        本作品为原创校园生活模拟游戏。
                    </p>

                    <p>
                        游戏中的故事、校园与事件均为原创设定。
                    </p>

                    <button id="statementNext">
                        下一步
                    </button>

                </div>

            </section>

            <!-- 作者的话 -->
            <section id="author" class="page">

                <div class="card">

                    <h2>作者的话</h2>

                    <p>
                        你好，我是66。
                    </p>

                    <p>
                        谢谢你来到这里。
                    </p>

                    <p>
                        希望《她和他们》能陪你度过一段温暖的时光。
                    </p>

                    <button id="authorNext">
                        开始游戏
                    </button>

                </div>

            </section>

        </main>

    </div>

    <script src="script.js"></script>

</body>

</html>
